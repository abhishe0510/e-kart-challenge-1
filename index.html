<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Explorer</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>PRODUCT EXPLORER</h1>

    <section class="price-finder">
        <h2>Smart Price Finder</h2>
        <p>Find products around</p>

        <div class="price-search">
            <input
                type="number"
                id="target-price"
                placeholder="Enter target price"
                min="1"
            >

            <button id="search-button" type="button">
                Search
            </button>
        </div>

        <p id="price-message"></p>
    </section>

    <section class="range-filter">
        <h2>Filter by Price Range</h2>

        <div class="price-search">
            <input
                type="number"
                id="min-price"
                placeholder="Minimum price"
                min="0"
            >

            <input
                type="number"
                id="max-price"
                placeholder="Maximum price"
                min="0"
            >

            <button id="filter-button" type="button">
                Filter Products
            </button>

            <button id="reset-button" type="button">
                Show All Products
            </button>
        </div>

        <p id="filter-message"></p>
        <div id="filter-result"></div>
    </section>

    <section>
        <h2>Closest Products</h2>
        <div id="search-result"></div>
    </section>

    
<section>
    <h2>Products</h2>

    <div class="sort-container">
        <label for="sort-products">Sort by:</label>

        <select id="sort-products">
            <option value="default">Default Order</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Rating: Highest First</option>
            <option value="name">Name: A to Z</option>
        </select>
    </div>

    <div id="product-container"></div>
</section>


    <script src="./data.js"></script>
    <script src="./script.js"></script>

</body>

</html>
